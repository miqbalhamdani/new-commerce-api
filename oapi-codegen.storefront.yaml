# Generator config for contracts/storefront.yaml -> internal/storefront/gen.go.
# Run it with `make generate`. Never edit the output.
#
# A package of its own, from a document of its own: the storefront never
# imports the admin API, nor it this (P1-202). Non-strict, like the admin
# server, and nothing else generated -- no StrictServerInterface nobody uses.
package: storefront
output: internal/storefront/gen.go

generate:
  models: true
  chi-server: true

output-options:
  # The skeleton has no paths yet, and oapi-codegen prunes components that no
  # path references; without this Problem would vanish until P1-203.
  skip-prune: true

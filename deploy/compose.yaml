# The production stack on one VPS (P1-001; 01-product-requirements.md,
# "Deployment"). Images come from CI (ghcr.io); deploy.sh rolls a release.
# compose.local.yaml adds what a developer machine lacks (README.md).
#
# Each service is given only the settings it uses: the API and the worker
# never see the database superuser's password, Postgres never sees an app
# secret. Required values are `:?` -- Compose refuses to start without them.
#
# Sized for the box: 4 vCPU, 8 GB (P1-002). The limits add up to less than
# that on purpose; the rest is the page cache Postgres counts on
# (effective_cache_size) and the OS.
name: new-commerce

x-app-env: &app-env
  ENVIRONMENT: production
  APP_DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@postgres:5432/new_commerce?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_USE_SSL: ${S3_USE_SSL:-true}
  IMAGE_BASE_URL: ${IMAGE_BASE_URL:?}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  INVITE_SECRET: ${INVITE_SECRET:?}
  PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:?}

x-app-deps: &app-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

x-api: &api
  image: ${API_IMAGE:-ghcr.io/miqbalhamdani/new-commerce-api:main}
  command: ["api"]
  restart: unless-stopped
  environment:
    <<: *app-env
    JWT_SECRET: ${JWT_SECRET:?}
    ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
    BITESHIP_API_KEY: ${BITESHIP_API_KEY:?}
    BITESHIP_URL: ${BITESHIP_URL:-https://api.biteship.com}
    API_URL: https://${API_HOST:?}
    # Caddy, and only Caddy, is believed for X-Real-IP (04-api-spec.md §1).
    TRUSTED_PROXIES: 172.30.0.2/32
  depends_on: *app-deps
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
    interval: 2s
    timeout: 3s
    retries: 30
  # api drains 3 s, then gives in-flight requests 10 s (cmd/api).
  stop_grace_period: 20s
  cpus: 1
  mem_limit: 512m

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?}
      API_HOST: ${API_HOST:?}
      TLS: ${TLS:?}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.2
    cpus: 0.5
    mem_limit: 256m

  web:
    image: ${WEB_IMAGE:-ghcr.io/miqbalhamdani/new-commerce-web:main}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m

  api-1: *api
  api-2: *api

  worker:
    image: ${API_IMAGE:-ghcr.io/miqbalhamdani/new-commerce-api:main}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:?}
      ADMIN_URL: https://${ADMIN_HOST:?}
    depends_on: *app-deps
    # A stream read blocks up to 30 s before it sees the signal (internal/jobs).
    stop_grace_period: 40s
    # libvips holds a decoded image in memory while it makes derivatives.
    cpus: 1
    mem_limit: 1g

  # One-shot, before every release: the schema owner applies migrations.
  migrate:
    image: ${API_IMAGE:-ghcr.io/miqbalhamdani/new-commerce-api:main}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/new_commerce?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:18
    restart: unless-stopped
    # Tuned for a shared box (P1-002): a quarter of RAM for shared buffers,
    # the planner told about the page cache, 100 connections -- two API
    # pools and the worker's use a few dozen at most.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - max_connections=100
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - wal_level=replica
    shm_size: 512m
    cpus: 2
    mem_limit: 3g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: new_commerce
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/app-user.sh:/docker-entrypoint-initdb.d/app-user.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "new_commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s

  redis:
    image: redis:8
    restart: unless-stopped
    # Jobs and emails live in its streams: append-only, fsynced each second,
    # and never evicted -- a full Redis refuses writes rather than silently
    # dropping a queued job (P1-002).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Containers without a fixed address are given one from here, so
          # 172.30.0.2 -- Caddy's, which TRUSTED_PROXIES names -- is never
          # handed to whichever service deploy.sh starts first.
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

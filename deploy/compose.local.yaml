# What a developer machine adds to compose.yaml (README.md): images built
# from the three repos, MinIO in place of R2, a fixed-rate Biteship, Caddy's
# own CA, and Postgres on 127.0.0.1:55432 so dev-seed can reach it.
services:
  api-1:
    build: { context: .., args: { VERSION: local } }
    depends_on:
      storage-init: { condition: service_completed_successfully }
  api-2:
    depends_on:
      storage-init: { condition: service_completed_successfully }
  web:
    build: ../../new-commerce-web
  storefront:
    build: ../../belli-storefront
    # api.localhost is the container itself in here; go round Caddy instead.
    environment:
      API_URL: http://api-1:8080/v1/storefront

  postgres:
    ports: ["127.0.0.1:55432:5432"]

  # The community MinIO is published as source only; built here once.
  minio:
    build: ./local/minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "minio-ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-init:
    image: ${API_IMAGE:-ghcr.io/miqbalhamdani/new-commerce-api:main}
    command: ["storage-init"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      minio: { condition: service_healthy }

  # Biteship's rates endpoint, answering one fixed quote.
  biteship:
    image: caddy:2
    volumes:
      - ./local/biteship.Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  miniodata:
